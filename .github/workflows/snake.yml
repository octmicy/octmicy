name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: octmicy
          outputs: |
            dist/github-snake.svg?color_snake=ffaec5&color_dots=efe6d6,d8e8f0,bfe3f0,a9c9e0&color_outside=fbf6ec
            dist/github-snake-dark.svg?color_snake=ffc2d4&color_dots=3a3450,4a4266,5d5488,8a72b8&color_outside=2a2535

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          keep_files: true