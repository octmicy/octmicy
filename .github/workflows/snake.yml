name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: octmicy
          outputs: |
            dist/github-snake.svg?color_snake=%23ffaec5&color_dots=%23efe6d6,%23d8e8f0,%23bfe3f0,%23a9c9e0,%238a72b8
            dist/github-snake-dark.svg?color_snake=%23ffc2d4&color_dots=%233a3450,%234a4266,%235d5488,%238a72b8,%23b9a7e0

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          keep_files: true